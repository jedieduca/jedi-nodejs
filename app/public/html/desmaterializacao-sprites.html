<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desmaterializacao - Poeira Magica</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0e12;
        color: #f6f9ff;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      }

      .demo {
        width: min(980px, 92vw);
      }

      .demo h1 {
        margin: 0 0 0.75rem;
        font-size: 1.35rem;
      }

      .demo p {
        margin: 0 0 1rem;
        color: #9bb1db;
      }

      .examples {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1rem;
      }

      .example h2 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
        color: #d9e7ff;
      }

      .sprite-frame {
        width: 100%;
        height: 240px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        border: 1px dashed rgba(255, 255, 255, 0.35);
        position: relative;
        overflow: hidden;
        background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.12), transparent 55%),
          radial-gradient(circle at 80% 40%, rgba(125, 204, 255, 0.2), transparent 45%),
          #0b0e12;
      }

      .sprite-frame::before,
      .sprite-frame::after {
        content: "";
        position: absolute;
        pointer-events: none;
        opacity: 0;
      }

      .sprite-frame::before {
        inset: 16% 18%;
        background: radial-gradient(circle, rgba(205, 143, 255, 0.75) 0%, rgba(95, 203, 255, 0.45) 45%, transparent 72%);
        filter: blur(10px);
        transform: scale(0.35);
        z-index: 1;
      }

      .sprite-frame::after {
        inset: 18% 24%;
        background:
          radial-gradient(circle, rgba(255, 255, 255, 0.98) 0 8%, transparent 10%) 15% 78% / 34px 34px no-repeat,
          radial-gradient(circle, rgba(199, 238, 255, 0.9) 0 10%, transparent 12%) 75% 70% / 40px 40px no-repeat,
          radial-gradient(circle, rgba(196, 159, 255, 0.9) 0 9%, transparent 11%) 62% 86% / 30px 30px no-repeat,
          radial-gradient(circle, rgba(150, 215, 255, 0.95) 0 8%, transparent 10%) 36% 62% / 26px 26px no-repeat,
          radial-gradient(circle, rgba(255, 255, 255, 0.95) 0 8%, transparent 10%) 52% 82% / 24px 24px no-repeat;
        mix-blend-mode: screen;
        transform: translateY(26px) scale(0.75);
        z-index: 3;
      }

      .sprite-frame img {
        width: min(220px, 80%);
        position: relative;
        z-index: 2;
        filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.6));
      }

      .sprite-frame:hover img {
        animation: arcane-vanish 4s ease forwards;
      }

      .sprite-frame:hover::before {
        animation: arcane-burst 4s ease forwards;
      }

      .sprite-frame:hover::after {
        animation: sparkles-rise 4s ease forwards;
      }

      .sprite-frame.materialize {
        background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.08), transparent 55%),
          radial-gradient(circle at 80% 40%, rgba(125, 204, 255, 0.14), transparent 45%),
          #0b0e12;
      }

      .sprite-frame.materialize img {
        opacity: 0;
        transform: scale(0.86) translateY(-9px);
        filter: blur(7px) brightness(1.9) saturate(2.1);
      }

      .sprite-frame.materialize::before {
        transform: scale(1.35);
      }

      .sprite-frame.materialize::after {
        transform: translateY(-30px) scale(1.15);
      }

      .sprite-frame.materialize:hover img {
        animation: arcane-vanish 4s ease reverse forwards;
      }

      .sprite-frame.materialize:hover::before {
        animation: arcane-burst 4s ease reverse forwards;
      }

      .sprite-frame.materialize:hover::after {
        animation: sparkles-rise 4s ease reverse forwards;
      }

      @keyframes arcane-vanish {
        0% {
          opacity: 1;
          transform: scale(1);
          filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.6)) brightness(1) saturate(1);
        }
        35% {
          opacity: 1;
          filter: drop-shadow(0 0 24px rgba(197, 140, 255, 0.9)) brightness(1.28) saturate(1.7);
        }
        100% {
          opacity: 0;
          transform: scale(0.86) translateY(-9px);
          filter: blur(7px) brightness(1.9) saturate(2.1);
        }
      }

      @keyframes arcane-burst {
        0% {
          opacity: 0;
          transform: scale(0.25);
        }
        25% {
          opacity: 0.95;
        }
        100% {
          opacity: 0;
          transform: scale(1.35);
        }
      }

      @keyframes sparkles-rise {
        0% {
          opacity: 0;
          transform: translateY(26px) scale(0.75);
        }
        30% {
          opacity: 0.95;
        }
        100% {
          opacity: 0;
          transform: translateY(-30px) scale(1.15);
        }
      }
    </style>
  </head>
  <body>
    <section class="demo">
      <h1>Desmaterializacao magica (poeira)</h1>
      <p>Passe o mouse nos quadros: esquerda desmaterializa, direita materializa.</p>
      <div class="examples">
        <article class="example">
          <h2>Desmaterializacao</h2>
          <div class="sprite-frame">
            <img src="http://app.jedieduca.com.br/macaco-olhando.gif" alt="Sprite do macaco olhando" />
          </div>
        </article>

        <article class="example">
          <h2>Materializacao (inverso)</h2>
          <div class="sprite-frame materialize">
            <img src="http://app.jedieduca.com.br/macaco-olhando.gif" alt="Sprite do macaco surgindo" />
          </div>
        </article>
      </div>
    </section>
  </body>
</html>
