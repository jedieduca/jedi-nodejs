<!DOCTYPE html>

<html class="dark" lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#cae63d",
                        "background-light": "#f8f8f6",
                        "background-dark": "#1e2111",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>JEDi Educa - Login</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
<!-- Background Game Screen Placeholder -->
<div class="fixed inset-0 z-0 overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center blur-sm opacity-50" data-alt="Fundo de tela de entrada do jogo educativo com cores vibrantes" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDgteK1jDQ6bC_7zVrI-rISNXituzMgqI-yzJNOLzhItAKQ1IFCJVf6BILypuK8Jsk3kUP4T8p4z7k-E8Cx4llzGvEuElCZGHg8XrETQ9Wg-l9s0t_BPdNBExw_gcdnvDlRrcBKZ1_gti5c-owpbS_ZADT7zrYNB_eN0BrPIz6ZYt-WBQn3ImkMtgVm-Il81ge8gg7vcLmuOBnGAJpx9qo0JXRaD4QADcVbEuSX9YIeI_b6s5g17WMUGjQSiMTodxbUQghpAGtJ0VMe');"></div>
<div class="absolute inset-0 bg-background-dark/60"></div>
</div>
<!-- Login Modal/Card -->
<div class="relative z-10 w-full max-w-[480px] bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md rounded-xl shadow-2xl border border-primary/20 overflow-hidden">
<!-- Header with Logo -->
<div class="pt-10 pb-6 px-8 flex flex-col items-center">
<div class="w-32 h-32 mb-6 bg-primary/10 rounded-full flex items-center justify-center p-4 border border-primary/30">
<img alt="JEDi Educa Logo" class="w-full h-full object-contain" data-alt="Logotipo JEDi Educa com estilo lúdico e moderno" src="../../public/assets/Logo_JEDi_fundo_escuro.png"/>
</div>
<h1 class="text-3xl font-bold text-slate-900 dark:text-white text-center">Bem-vindo ao JEDi Educa!</h1>
<p class="text-slate-600 dark:text-slate-400 text-center mt-2">Pronto para começar sua jornada?</p>
</div>
<!-- Form Section -->
<div class="px-8 pb-10 space-y-5">
<!-- User Input -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300 ml-1">Usuário ou Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary">person</span>
<input class="w-full pl-12 pr-4 py-4 bg-white dark:bg-background-dark/50 border border-slate-200 dark:border-primary/20 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-slate-900 dark:text-white placeholder:text-slate-400" placeholder="Digite seu usuário ou email" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300 ml-1">Senha</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-white dark:bg-background-dark/50 border border-slate-200 dark:border-primary/20 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-slate-900 dark:text-white placeholder:text-slate-400" placeholder="Digite sua senha" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="flex justify-end px-1">
<a class="text-xs font-medium text-primary hover:underline transition-all" href="#">Esqueci minha senha</a>
</div>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold text-lg py-4 rounded-xl shadow-lg shadow-primary/20 transition-all transform active:scale-[0.98]">
                    Entrar
                </button>
</div>
<!-- Footer Links -->
<div class="text-center pt-4">
<p class="text-slate-600 dark:text-slate-400 text-sm">
                    Ainda não tem uma conta? 
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Criar uma conta</a>
</p>
</div>
</div>
<!-- Decorative Accent -->
<div class="h-2 w-full bg-gradient-to-r from-primary/20 via-primary to-primary/20"></div>
</div>
</body></html>
