services:
  node_api:
    build: .
    container_name: node_api
    restart: unless-stopped
    expose:
      - "3000" # Porta HTTP interna
      - "3001" # Porta HTTPS interna
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      # Volume vindo do Windows não avisa o container quando um arquivo muda;
      # com polling o servidor de desenvolvimento recompila ao salvar
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    networks:
      - jedieduca-network

networks:
  jedieduca-network:
    external: true